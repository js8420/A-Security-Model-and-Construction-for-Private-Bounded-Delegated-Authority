[package]
name = "delegation-circuit"
version = "0.1.0"
edition = "2021"

[dependencies]
p3-field = "0.6.3"
p3-goldilocks = "0.6.3"
p3-matrix = "0.6.3"
p3-air = "0.6.3"
p3-uni-stark = "0.6.3"
p3-commit = "0.6.3"
p3-challenger = "0.6.3"
p3-dft = "0.6.3"
p3-fri = "0.6.3"
p3-merkle-tree = "0.6.3"
p3-symmetric = "0.6.3"
p3-poseidon2 = "0.6.3"
p3-poseidon2-air = "0.6.3"
p3-util = "0.6.3"
rand = "0.8.8"
rand10 = { package = "rand", version = "0.10.2", features = ["std_rng", "chacha"] }
rand_core = "0.10.1"
sha2 = "0.10.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

[profile.release]
lto = "fat"
